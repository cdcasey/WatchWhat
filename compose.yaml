services:
  watchwhat:
    image: watchwhat:latest
    build: .
    env_file: .env # WATCHWHAT_TMDB_TOKEN, TZ, ... (see .env.example)
    ports:
      - "8080:8080"
      # WatchWhat has no auth. To expose it only on the tailnet, publish on the
      # host's Tailscale IP instead (`tailscale ip -4`):
      # - "100.x.y.z:8080:8080"
    volumes:
      - watchwhat-data:/data
      # Or a bind mount (directory must be owned by 65532:65532, see README):
      # - /srv/watchwhat:/data
    restart: unless-stopped

volumes:
  watchwhat-data:
    name: watchwhat-data # unprefixed, so the README backup commands work as-is
