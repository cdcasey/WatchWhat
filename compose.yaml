services:
  watchwhat:
    image: watchwhat:latest
    build: .
    env_file: .env # WATCHWHAT_TMDB_TOKEN, TZ, ... (see .env.example)
    ports:
      # Loopback only: WatchWhat has no auth, so the host's Caddy is the only
      # way in. Host port is WATCHWHAT_PORT from .env (default 8081; wordler
      # already uses 8080 on the mini).
      - "127.0.0.1:${WATCHWHAT_PORT:-8081}:8080"
    volumes:
      - watchwhat-data:/data
    restart: unless-stopped

volumes:
  watchwhat-data:
    name: watchwhat-data # unprefixed, so the README backup commands work as-is
